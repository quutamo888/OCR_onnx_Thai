[package]
name = "thai_rust_ocr"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = "2.0.0-rc.15"
image = "0.25"
ndarray = "0.17"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
