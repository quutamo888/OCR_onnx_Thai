worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" ${request_time}s';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    # Internal Docker DNS resolver with fast TTL for dynamic scaling discovery
    resolver 127.0.0.11 valid=3s ipv6=off;

    # ---------------------------------------------------------------------------
    # 1. HTTP Server (Port 80) -> Force Redirect to HTTPS
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # 2. HTTPS Main Server (Port 443) -> Enforced TLS 1.3
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Strict TLS 1.3 Configuration
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        ssl_certificate /etc/nginx/certs/web_server.crt;
        ssl_certificate_key /etc/nginx/certs/web_server.key;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardening Security Headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Proxy to FastAPI Web Portal & API
        location / {
            set $upstream_app http://thai-ocr-app:8000;
            proxy_pass $upstream_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket & SSE Support for live OCR progress
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }
    }

    # ---------------------------------------------------------------------------
    # 3. Internal Rust OCR Worker Load Balancer (Port 8001)
    # ---------------------------------------------------------------------------
    server {
        listen 8001;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        location / {
            set $upstream_backend http://rust-ocr-worker:8001;
            proxy_pass $upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            set $upstream_backend http://rust-ocr-worker:8001;
            proxy_pass $upstream_backend/health;
        }
    }
}
